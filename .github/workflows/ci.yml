name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sinapse_test
          POSTGRES_USER: sinapse
          POSTGRES_PASSWORD: sinapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinapse -d sinapse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sinapse:sinapse@127.0.0.1:5432/sinapse_test
      TEST_DATABASE_URL: postgresql://sinapse:sinapse@127.0.0.1:5432/sinapse_test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      # GitHub's Ubuntu image already carries the shared browser libraries.
      # Avoid apt here: unrelated third-party repository races can otherwise block CI.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
