services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sinapse
      POSTGRES_USER: sinapse
      POSTGRES_PASSWORD: sinapse
    ports:
      - "5432:5432"
    volumes:
      - sinapse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinapse -d sinapse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sinapse_postgres:
