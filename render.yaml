services:
  - type: web
    name: sinapse-v3-liandro-beta
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sinapse-v3-liandro-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: fake
      - key: NODE_VERSION
        value: 22.22.0

databases:
  - name: sinapse-v3-liandro-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: sinapse
    user: sinapse
    ipAllowList: []
